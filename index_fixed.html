<!DOCTYPE html><html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0f"><title>Megashoop — Premium Store</title><style>
:root{--gold:#e6b75c;--gold2:#f7d68c;--ink:#080b10;--panel:#151a22;--muted:#9ca4af;--line:#34353b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#090b0f;color:#f6f3eb;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1220px;margin:auto;padding:0 24px}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header{background:#0d1016;border-bottom:1px solid #292c33}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:95px;flex-wrap:wrap}.brand{font-size:34px;font-weight:900;letter-spacing:-1.2px}.brand span{color:var(--gold)}.languages{display:flex;gap:8px;flex-wrap:wrap}.languages button{padding:10px 13px;border:1px solid #444750;background:#1b2029;color:#ddd;border-radius:5px;font-size:12px;font-weight:700}.languages button.active{color:#14100a;background:var(--gold);border-color:var(--gold)}.tagline{font-size:12px;color:#a9aab0;margin:-12px 0 15px}.search-row{display:flex;gap:12px;padding-bottom:20px}.search-row input{width:100%;min-width:0;background:#171c25;border:1px solid #41454d;color:white;padding:14px 16px;border-radius:6px}.gold{background:linear-gradient(125deg,#d6a345,#f5d080);color:#15100a;border:0;border-radius:6px;font-weight:800;padding:13px 19px}.gold:hover{filter:brightness(1.1)}
.hero{position:relative;isolation:isolate;min-height:435px;background:radial-gradient(ellipse at 78% 38%,#3c3326 0%,transparent 43%),linear-gradient(110deg,#14171d,#080a0e);border-bottom:1px solid #373027;overflow:hidden}.hero:before{content:'';position:absolute;inset:0;z-index:-1;opacity:.23;background:repeating-linear-gradient(115deg,transparent 0 65px,#a98b5630 66px 67px,transparent 68px 130px)}.hero-inner{display:flex;align-items:center;min-height:435px;gap:25px}.hero-copy{flex:1;max-width:650px;padding:55px 0}.eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase}.hero h1{font-family:Georgia,serif;font-size:clamp(40px,5.3vw,76px);line-height:1.05;letter-spacing:-1.6px;margin:18px 0;color:#f7f4eb}.hero h1 em{color:var(--gold);font-style:normal}.hero p{max-width:510px;color:#b8b7b4;line-height:1.8}.hero a{display:inline-block;margin-top:20px;text-decoration:none}.hero-art{flex:0 0 38%;min-width:0;position:relative;display:grid;place-items:center;height:330px}.hero-ring{position:absolute;width:315px;height:315px;border:1px solid #a88c5640;border-radius:50%;box-shadow:0 0 0 34px #d2a75a0b,0 0 0 80px #d2a75a07}.hero-art img{position:relative;width:100%;height:330px;object-fit:contain;filter:drop-shadow(0 26px 30px #000a);border-radius:14px;mix-blend-mode:lighten}.hero-art img[hidden]{display:none}.hero-monogram{position:absolute;font-size:180px;color:#cba65b18;font-weight:900;letter-spacing:-15px;user-select:none}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#38332c;border:1px solid #38332c;margin-top:32px}.feature{background:#13161c;padding:22px;display:flex;gap:14px;align-items:center}.feature .symbol{color:var(--gold);font-size:25px}.feature b{display:block;font-size:14px}.feature small{display:block;color:#a4a5ab;margin-top:6px;font-size:12px}
main{padding-top:70px!important;padding-bottom:100px!important}.section-label{font-size:12px;color:var(--gold);letter-spacing:3px;font-weight:800}.section-title{font-family:Georgia,serif;font-size:clamp(31px,4vw,47px);margin:12px 0 12px}.accent{width:70px;height:3px;background:var(--gold);margin:0 0 18px}#status{color:#a7a9b1;font-size:14px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:23px;margin-top:30px}.card{background:linear-gradient(160deg,#1d222a,#11151b);border:1px solid #3a3b3d;border-radius:11px;overflow:hidden;box-shadow:0 15px 35px #0006;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-5px);border-color:#aa874c}.photo{height:240px;display:grid;place-items:center;background:radial-gradient(circle at center,#333a40,#171b21);overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}.info{padding:22px}.info h3{font-size:17px;line-height:1.45;min-height:50px;margin:0 0 16px}.price{color:var(--gold2);font-size:27px;font-weight:900}.stock{color:#a9aeb7;font-size:13px}.buy{width:100%;margin-top:10px}.buy:disabled{opacity:.45;cursor:not-allowed}#cart{margin-top:40px;background:#161b23;padding:25px;border:1px solid #47403a;border-radius:10px}#cart[hidden]{display:none}.cart-row{display:flex;align-items:center;gap:15px;justify-content:space-between;border-bottom:1px solid #343943;padding:14px 0}.remove{background:#522b2b;color:white;border:0;border-radius:5px;padding:8px}.cart-note{color:var(--muted)}footer{padding:34px;text-align:center;color:#979ba4;background:#0c0f14;border-top:1px solid #303038;font-size:13px}
@media(max-width:760px){.hero-inner{min-height:390px}.hero-art{display:none}.hero-copy{padding:55px 0}.features{grid-template-columns:1fr}.top{padding-top:18px;padding-bottom:20px}.tagline{margin:0 0 16px}.search-row{flex-wrap:wrap}.search-row input{flex-basis:100%}main{padding-top:42px!important}}@media(max-width:520px){.wrap{padding-left:16px;padding-right:16px}.brand{font-size:29px}.languages button{font-size:11px;padding:9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photo{height:155px}.info{padding:13px}.info h3{font-size:13px;min-height:56px}.price{font-size:20px}.buy{font-size:12px;padding:11px 7px}.hero h1{font-size:42px}}

<script>
'use strict';
const SUPABASE_URL='https://mrslybtwzfcovpsyuexf.supabase.co';
const SUPABASE_KEY='sb_publishable_AnpUjix60jDfpZDGlcO6vQ_XIyxcpDd'.trim();
const $=id=>document.getElementById(id);
const translations={
 ka:{subtitle:'ელექტროინსტრუმენტები, ელექტრონიკა და აღჭურვილობა',catalog:'პროდუქციის კატალოგი',search:'პროდუქტის ძებნა...',cart:'კალათა',cartTitle:'თქვენი კალათა',found:'ნაპოვნია პროდუქტი:',loading:'პროდუქტები იტვირთება...',empty:'პროდუქტები ვერ მოიძებნა',error:'პროდუქტების ჩატვირთვა ვერ მოხერხდა',stock:'მარაგშია:',buy:'კალათაში დამატება',sold:'არ არის მარაგში',total:'სულ:',remove:'წაშლა',shortage:'მარაგში საკმარისი რაოდენობა არ არის',note:'შეკვეთის გაფორმება მალე დაემატება.',footer:'ყველა უფლება დაცულია.'},
 ru:{subtitle:'Электроинструменты, электроника и оборудование',catalog:'Каталог товаров',search:'Поиск товаров...',cart:'Корзина',cartTitle:'Ваша корзина',found:'Найдено товаров:',loading:'Загрузка товаров...',empty:'Товары не найдены',error:'Не удалось загрузить товары',stock:'В наличии:',buy:'В корзину',sold:'Нет в наличии',total:'Итого:',remove:'Удалить',shortage:'Недостаточно товара на складе',note:'Оформление заказов добавим позже.',footer:'Все права защищены.'},
 az:{subtitle:'Elektrik alətləri, elektronika və avadanlıqlar',catalog:'Məhsul kataloqu',search:'Məhsul axtar...',cart:'Səbət',cartTitle:'Sizin səbətiniz',found:'Tapılan məhsullar:',loading:'Məhsullar yüklənir...',empty:'Məhsul tapılmadı',error:'Məhsulları yükləmək mümkün olmadı',stock:'Stokda:',buy:'Səbətə əlavə et',sold:'Stokda yoxdur',total:'Cəmi:',remove:'Sil',shortage:'Anbarda kifayət qədər məhsul yoxdur',note:'Sifariş sistemi tezliklə əlavə ediləcək.',footer:'Bütün hüquqlar qorunur.'}
};
let lang='ka';try{const saved=localStorage.getItem('megashoop-language');if(translations[saved])lang=saved}catch(e){}
let products=[],cart=[],loading=true,loadError=false;let activeCategory='all';
const t=()=>translations[lang];
const nameOf=p=>String(p['имя']??p.name??'Megashoop');
const priceOf=p=>Number(p['цена']??p.price??0);
const stockOf=p=>Number(p['запас']??p.stock??0);
const unitOf=p=>String(p['единица']??p.unit??'шт');
const idOf=p=>String(p.id??p['идентифи']??nameOf(p));
const money=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₾';
function setHeroImage(){/* Premium hero artwork is embedded in CSS; product images stay in catalog. */}
function updateCount(){const count=cart.reduce((s,p)=>s+p.quantity,0);$('cartToggle').textContent='🛒 '+t().cart+' ('+count+')'}
function renderProducts(){const box=$('products');box.replaceChildren();const query=$('search').value.toLocaleLowerCase().trim();const items=products.filter(p=>{const name=nameOf(p).toLocaleLowerCase();const cat=String(p.category??p['категория']??'').toLocaleLowerCase();const words={power:['drill','bosch','шуруп','дрель','болгар','ინსტრუმ','ელექტრო ხელსაწყ','перфорат','tool'],hand:['ручн','hand','ხელის','ключ','отвертк'],electrical:['электр','кабел','ელექტრო','cable'],building:['строит','строй','სამშენებლო'],security:['камер','camera','ვიდეო','უსაფრთხო'],lighting:['ламп','свет','განათებ','light'],generator:['генератор','გენერატორ','generator'],home:['дом','сад','ბაღ','სახლის'],auto:['авто','auto','ავტო']}[activeCategory]||[];return name.includes(query)&&(activeCategory==='all'||words.some(w=>name.includes(w)||cat.includes(w)))});if(!loading&&!loadError&&!items.length){const p=document.createElement('p');p.textContent=t().empty;box.append(p)}
 for(const product of items){const card=document.createElement('article');card.className='card';const photo=document.createElement('div');photo.className='photo';const img=document.createElement('img');img.alt=nameOf(product);img.loading='lazy';img.src=product.image_url||'https://placehold.co/400x300/253144/ffffff?text=Megashoop';img.onerror=()=>{img.onerror=null;img.src='https://placehold.co/400x300/253144/ffffff?text=Megashoop'};photo.append(img);
 const info=document.createElement('div');info.className='info';const name=document.createElement('h3');name.textContent=nameOf(product);const price=document.createElement('div');price.className='price';price.textContent=money(priceOf(product));const stock=document.createElement('p');stock.className='stock';stock.textContent=t().stock+' '+stockOf(product)+' '+unitOf(product);const buy=document.createElement('button');buy.className='gold buy';buy.textContent=stockOf(product)>0?t().buy:t().sold;buy.disabled=stockOf(product)<=0;buy.onclick=()=>addToCart(product);info.append(name,price,stock,buy);card.append(photo,info);box.append(card)} }
function addToCart(product){const id=idOf(product);const existing=cart.find(p=>p.id===id);if((existing?.quantity||0)>=stockOf(product)){alert(t().shortage);return}if(existing)existing.quantity++;else cart.push({id,name:nameOf(product),price:priceOf(product),quantity:1});updateCount();renderCart()}
function renderCart(){const box=$('cartItems');box.replaceChildren();for(const item of cart){const row=document.createElement('div');row.className='cart-row';const label=document.createElement('span');label.textContent=item.name+' × '+item.quantity;const amount=document.createElement('strong');amount.textContent=money(item.price*item.quantity);const remove=document.createElement('button');remove.className='remove';remove.textContent=t().remove;remove.onclick=()=>{cart=cart.filter(p=>p.id!==item.id);updateCount();renderCart()};row.append(label,amount,remove);box.append(row)}$('total').textContent=t().total+' '+money(cart.reduce((s,p)=>s+p.price*p.quantity,0))}
function updateLanguage(){document.documentElement.lang=lang;$('subtitle').textContent=t().subtitle;$('heroSub').textContent=t().subtitle;$('heroTitle').replaceChildren();const heroParts=({ka:['პროფესიონალური','ხელსაწყოები'],ru:['Профессиональные','инструменты'],az:['Peşəkar','alətlər']})[lang];$('heroTitle').append(document.createTextNode(heroParts[0]+' '));const heroEm=document.createElement('em');heroEm.textContent=heroParts[1];$('heroTitle').append(heroEm);$('heroButton').textContent=({ka:'პროდუქციის ნახვა',ru:'Смотреть каталог',az:'Kataloqa bax'})[lang];$('eyebrow').textContent=({ka:'ხარისხი ყოველ დეტალში',ru:'КАЧЕСТВО В КАЖДОЙ ДЕТАЛИ',az:'HƏR DETALDA KEYFİYYƏT'})[lang];$('catalogTitle').textContent=t().catalog;$('search').placeholder=t().search;$('cartTitle').textContent=t().cartTitle;$('checkoutNote').textContent=t().note;$('footer').textContent='© 2026 Megashoop. '+t().footer;$('status').textContent=loading?t().loading:loadError?t().error+' — '+(window.lastLoadError||'') :t().found+' '+products.length;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));updateCount();renderProducts();renderCart()}
async function loadProducts(){try{const response=await fetch(SUPABASE_URL+'/rest/v1/products?select=*',{headers:{apikey:SUPABASE_KEY}});if(!response.ok)throw new Error('Supabase HTTP '+response.status);const data=await response.json();if(!Array.isArray(data))throw new Error('Invalid response');products=data;loadError=false;setHeroImage()}catch(error){console.error(error);window.lastLoadError=String(error.message||error);loadError=true}finally{loading=false;updateLanguage()}}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('megashoop-language',lang)}catch(e){}updateLanguage()}));
$('search').addEventListener('input',renderProducts);
document.querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>{activeCategory=button.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('selected',b.dataset.category===activeCategory));$('catalog').scrollIntoView({behavior:'smooth'});renderProducts()}));
$('cartToggle').addEventListener('click',()=>{$('cart').hidden=!$('cart').hidden;if(!$('cart').hidden)$('cart').scrollIntoView({behavior:'smooth'})});
updateLanguage();loadProducts();
</script></body></html>
