<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TOVEX — Каталог</title><style>
:root {
  --ink: #1c304b;
  --paper: #f5f5ee;
  --green: #118657;
  --blue: #284c88;
  --brand: linear-gradient(90deg, var(--green), var(--blue));
  --line: #dce2df;
}
* { box-sizing: border-box }
body { margin: 0; font: 16px/1.45 Inter, Arial, sans-serif; color: var(--ink); background: var(--paper) }
button, input { font: inherit }
button { cursor: pointer; color: inherit; border: 0; background: transparent }
button:focus-visible, a:focus-visible { outline: 3px solid #268094; outline-offset: 2px }
header { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 14px max(16px, calc((100% - 1160px)/2)) 0 }
.bar { display: flex; align-items: center; gap: 10px; min-height: 76px; padding: 14px; background: var(--brand); color: white; border-radius: 16px }
.brand { font-size: 32px; font-weight: 900; letter-spacing: -1.6px; line-height: 1; padding: 0; color: white }
.menu { border: 1px solid #ffffff70; border-radius: 12px; color: white; display: grid; place-items: center; width: 42px; height: 42px }
.search { display: flex; align-items: center; gap: 8px; background: white; border-radius: 18px; flex: 1; min-width: 0; padding: 0 14px; color: #577282; height: 46px }
.search input { color: var(--ink); background: transparent; width: 100%; min-width: 0; border: 0; outline: none }
.search:focus-within { outline: 3px solid #b3e5d2 }
main { max-width: 1192px; margin: auto; padding: 18px 16px 110px }
h1 { margin: 8px 0 18px; font-size: clamp(28px, 4vw, 36px); line-height: 1.14; letter-spacing: -.035em }
.list, .tile, .empty { background: white; border: 1px solid var(--line); border-radius: 18px }
.list { overflow: hidden }
.list:empty { display: none }
.row { width: 100%; display: flex; align-items: center; gap: 13px; min-height: 52px; padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--line); font-weight: 600 }
.row:last-child { border: 0 }
.row:hover { background: #edf5f0 }
.icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: #e9f3ee; font-size: 20px; flex-shrink: 0 }
.chev { width: 7px; height: 7px; border: solid #718090; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); margin-left: auto }
.back { color: var(--blue); padding: 4px 0 10px; font-weight: 600 }
.tile, .empty { padding: 20px; margin: 0 0 12px }
.tile b { display: block; margin-bottom: 12px }
.act { background: var(--brand); color: white; padding: 9px 15px; border-radius: 22px; margin: 2px; font-weight: 600 }
.act + .act { background: #edf3f8; color: var(--blue) }
.empty p { margin-top: 0 }
footer { position: fixed; bottom: 0; inset-inline: 0; background: white; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 2 }
nav { max-width: 680px; margin: auto; display: flex }
nav button { flex: 1; padding: 8px 2px; color: #5a6877; font-size: 13px }
nav svg { display: block; margin: 0 auto 3px }
nav .active { color: #0b7652; font-weight: bold }
svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; flex-shrink: 0 }
@media(min-width:760px) { .list:has(.icon) { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)) } .list:has(.icon) .row:nth-child(odd) { border-right: 1px solid var(--line) } }
@media(max-width:600px) { header { padding: 8px 8px 0 } .bar { min-height: 58px; padding: 9px; gap: 7px } .brand { font-size: 24px } .menu { width: 34px; height: 38px } .search { height: 40px; padding: 0 9px; border-radius: 14px } .search svg { width: 17px } main { padding: 13px 10px 90px } .row { padding: 8px 12px } }
</style></head><body><header><div class="bar"><button class="brand" data-go="Главная">TOVEX</button><button class="menu" aria-label="Открыть каталог" data-go="Каталог"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h18"/></svg></button><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><input type="search" aria-label="Поиск по каталогу" placeholder="Поиск на TOVEX" id="query"></label></div></header><main id="app"></main><footer><nav id="nav" aria-label="Основная навигация"></nav></footer><script>
const catalog=[
['Женщинам','👗','Платья|Блузки|Джинсы|Верхняя одежда'],['Обувь','👟','Кроссовки|Ботинки|Туфли'],['Детям','🧸','Игрушки|Одежда для детей|Для малышей'],['Мужчинам','👕','Футболки|Рубашки|Брюки'],['Дом','🏠','Посуда|Текстиль|Декор'],['Красота','🪞','Уход за лицом|Косметика|Парфюмерия'],['Аксессуары','👜','Сумки|Ремни|Кошельки'],['Электроника','🎧','Наушники|Смартфоны|Акустика'],['Спорт','⚽','Фитнес|Туризм|Велоспорт'],['Автотовары','🚗','Аксессуары для авто|Автокосметика'],['Книги','📚','Художественная литература|Детские книги'],['Ювелирные изделия','💍','Кольца|Серьги|Браслеты'],['Для ремонта','🛠️','Двери, окна и фурнитура|Инструменты и оснастка|Силовая техника и оборудование|Спецодежда и СИЗы|Отделочные материалы|Электрика|Лакокрасочные материалы|Сантехника|Вентиляция|Водоснабжение и газоснабжение|Отопление|Крепёж|Стройматериалы'],['Сад и дача','🌱','Садовый инструмент|Растения|Садовая мебель'],['Здоровье','🩺','БАДы|Дезинфекция, стерилизация и утилизация|Ухо, горло, нос|Контрацептивы и лубриканты|Специализированное питание|Маски защитные|Медицинские изделия|Медицинские приборы|Лабораторное оборудование и материалы|Оздоровление'],['Канцтовары','✏️','Блокноты|Ручки|Бумага']
];
const products={'Инструменты и оснастка':['Набор отвёрток','Рулетка 5 м'],'Медицинские приборы':['Электронный термометр'],'Наушники':['Беспроводные наушники'],'Футболки':['Футболка базовая'],'Посуда':['Кружка керамическая'],'Блокноты':['Блокнот в точку'],'Кроссовки':['Кроссовки городские'],'Крепёж':['Набор саморезов']};
const paths={'Главная':'M3 10l9-7 9 7v11h-6v-7H9v7H3z','Каталог':'M3 5h17M3 11h6M3 17h6 M19 16a4 4 0 1 0-8 0 4 4 0 0 0 8 0m-1 3 4 3','Корзина':'M2 4h3l3 12h11l3-9H6 M10 20h.01M18 20h.01','Избранное':'M12 21S2 14 2 8a5 5 0 0 1 10-1A5 5 0 0 1 22 8c0 6-10 13-10 13z'};
const saved=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch{return []}};
const lists={'Корзина':saved('Корзина'),'Избранное':saved('Избранное')};
function route(){try{return decodeURIComponent(location.hash.slice(1)).split('/')}catch{return ['Каталог']}}
function go(p){query.value='';if(location.hash==='#'+encodeURIComponent(p))render();else location.hash=encodeURIComponent(p)}
function row(label,target,icon=''){return '<button class="row" data-go="'+target+'">'+(icon?'<span class="icon" aria-hidden="true">'+icon+'</span>':'')+label+'<i class="chev"></i></button>'}
function tile(p){return '<div class="tile"><b>'+p+'</b>'+Object.keys(lists).map(k=>'<button class="act" data-list="'+k+'" data-item="'+p+'">'+(lists[k].includes(p)?(k==='Корзина'?'Убрать из корзины':'Убрать из избранного'):(k==='Корзина'?'В корзину':'В избранное'))+'</button>').join('')+'</div>'}
function render(){
let [page,category,sub]=route();if(!paths[page])page='Каталог';
const cat=catalog.find(c=>c[0]===category),q=query.value.trim().toLocaleLowerCase('ru');
let title=page,html='',back='';
if(q){page='Каталог';title='Результаты поиска';const rows=[];for(const [name,icon,subs] of catalog){if(name.toLowerCase().includes(q))rows.push(row(name,'Каталог/'+name,icon));for(const s of subs.split('|'))if(s.toLowerCase().includes(q))rows.push(row(s,'Каталог/'+name+'/'+s,icon))}html='<div class="list">'+rows.join('')+'</div>'+Object.values(products).flat().filter(p=>p.toLowerCase().includes(q)).map(tile).join('');if(html==='<div class="list"></div>')html='<p class="empty">Ничего не найдено. Попробуйте другое название.</p>'}
else if(page==='Каталог'&&cat){title=category;back='Каталог';if(cat[2].split('|').includes(sub)){title=sub;back='Каталог/'+category;html=(products[sub]||[]).map(tile).join('')||'<p class="empty">В этом разделе пока нет товаров.</p>'}else html='<div class="list">'+cat[2].split('|').map(s=>row(s,'Каталог/'+category+'/'+s)).join('')+'</div>'}
else if(page==='Каталог')html='<div class="list">'+catalog.map(c=>row(c[0],'Каталог/'+c[0],c[1])).join('')+'</div>';
else if(page==='Главная'){title='Популярные товары';html=Object.values(products).flat().map(tile).join('')}
else html=lists[page].map(tile).join('')||'<div class="empty"><p>'+(page==='Корзина'?'В корзине пока пусто':'В избранном пока пусто')+'</p><button class="act" data-go="Каталог">Перейти в каталог</button></div>';
app.innerHTML=(back?'<button class="back" data-go="'+back+'">‹ '+(back.split('/').pop())+'</button>':'')+'<h1>'+title+'</h1>'+html;
nav.innerHTML=Object.entries(paths).map(([n,d])=>'<button data-go="'+n+'" class="'+(n===page?'active':'')+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+d+'"/></svg>'+n+'</button>').join('')
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);render();window.scrollTo(0,0)}else if(b.dataset.list){const k=b.dataset.list,p=b.dataset.item;lists[k]=lists[k].includes(p)?lists[k].filter(x=>x!==p):[...lists[k],p];try{localStorage.setItem(k,JSON.stringify(lists[k]))}catch{}render()}});
query.oninput=render;window.onhashchange=()=>{query.value='';render();window.scrollTo(0,0)};render()
</script></body></html>
