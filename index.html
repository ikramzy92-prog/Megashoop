
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megashoop — Интернет-магазин</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5fb;color:#17233b}
header{background:#1554d8;color:white;padding:25px 20px}
.wrap{max-width:1100px;margin:auto}
h1{margin:0 0 8px;font-size:32px}
.search{display:flex;gap:12px;margin-top:20px}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:9px;font-size:16px}
button{border:0;border-radius:9px;padding:13px;cursor:pointer;font-weight:bold}
.cart-btn{background:white;color:#1554d8}
main{max-width:1100px;margin:auto;padding:30px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-top:20px}
.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #0001}
.card img{width:100%;height:220px;object-fit:contain}
.info{padding:16px}
.info h3{margin:0 0 12px}
.price{color:#1554d8;font-size:24px;font-weight:bold}
.stock{color:#64748b}
.buy{background:#1554d8;color:white;width:100%}
.buy:disabled{background:#aab5c8}
.cart-panel{background:white;padding:20px;border-radius:12px;margin-top:25px}
.cart-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ddd}
[hidden]{display:none!important}
footer{text-align:center;padding:30px;color:#64748b}
</style>
</head>
<body>

<header>
<div class="wrap">
<h1>Megashoop</h1>
<p>Электроинструменты, электроника и оборудование</p>
<div class="search">
<input id="search" placeholder="Поиск товаров...">
<button class="cart-btn" onclick="toggleCart()">🛒 Корзина: <span id="count">0</span></button>
</div>
</div>
</header>

<main>
<h2>Каталог товаров</h2>
<p id="status">Загрузка товаров...</p>
<div id="products" class="grid"></div>

<section id="cartPanel" class="cart-panel" hidden>
<h2>Ваша корзина</h2>
<div id="cartItems"></div>
<h3 id="total"></h3>
<p>Оформление заказа добавим следующим этапом.</p>
</section>
</main>

<footer>© 2026 Megashoop. Все права защищены.</footer>

<script>
const SUPABASE_URL = "https://mrslybtwzfcovpsyuexf.supabase.co";
const SUPABASE_KEY = "sb_publishable_AnpUjix60jDfpZDGlcO6vQ_XIyxcpDd";

let products = [];
let cart = [];

function money(value){
  return Number(value ?? 0).toLocaleString("ru-RU",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  }) + " ₾";
}

async function loadProducts(){
  const status = document.getElementById("status");
  try{
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/products?select=*",
      {
        headers:{
          "apikey":SUPABASE_KEY
        }
      }
    );

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    products = await response.json();
    renderProducts();
  }catch(error){
    console.error("Ошибка загрузки:",error);
    status.textContent = "Не удалось загрузить товары. Проверь подключение Supabase и права доступа.";
  }
}

function renderProducts(){
  const search = document.getElementById("search").value.toLowerCase();
  const filtered = products.filter(p =>
    String(p.name ?? "").toLowerCase().includes(search)
  );

  const container = document.getElementById("products");
  container.replaceChildren();

  document.getElementById("status").textContent =
    "Найдено товаров: " + filtered.length;

  filtered.forEach(product=>{
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = product.image_url || "";
    img.alt = product.name || "Товар";
    img.loading = "lazy";

    const info = document.createElement("div");
    info.className = "info";

    const name = document.createElement("h3");
    name.textContent = product.name || "Без названия";

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = money(product.price);

    const stock = document.createElement("p");
    stock.className = "stock";
    stock.textContent = "В наличии: " + (product.stock ?? 0) + " шт.";

    const buy = document.createElement("button");
    buy.className = "buy";
    buy.textContent = "В корзину";
    buy.disabled = Number(product.stock ?? 0) <= 0;
    buy.onclick = ()=>addToCart(product);

    info.append(name,price,stock,buy);
    card.append(img,info);
    container.append(card);
  });
}

function addToCart(product){
  const count = cart.filter(p=>p.id===product.id).length;
  if(count >= Number(product.stock ?? 0)){
    alert("Недостаточно товара на складе");
    return;
  }
  cart.push(product);
  updateCart();
}

function toggleCart(){
  const panel = document.getElementById("cartPanel");
  panel.hidden = !panel.hidden;
  updateCart();
}

function updateCart(){
  document.getElementById("count").textContent = cart.length;
  const container = document.getElementById("cartItems");
  container.replaceChildren();

  cart.forEach((product,index)=>{
    const row = document.createElement("div");
    row.className = "cart-row";

    const label = document.createElement("span");
    label.textContent = product.name + " — " + money(product.price);

    const remove = document.createElement("button");
    remove.textContent = "Удалить";
    remove.onclick = ()=>{
      cart.splice(index,1);
      updateCart();
    };

    row.append(label,remove);
    container.append(row);
  });

  const total = cart.reduce((sum,p)=>sum+Number(p.price ?? 0),0);
  document.getElementById("total").textContent = "Итого: " + money(total);
}

document.getElementById("search").addEventListener("input",renderProducts);
loadProducts();
</script>
</body>
</html>
