<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Geo — Back Office</title><style>:root{font-family:Arial,sans-serif;color:#e9edf5;background:#0c111b}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{width:235px;background:#141c2a;min-height:100vh;padding:25px 15px;position:fixed;border-right:1px solid #303c50}h2{color:#eab95c}nav button{display:block;width:100%;text-align:left;padding:13px;border:0;border-radius:9px;background:transparent;color:#dce4ef;margin:5px 0}nav button.active,nav button:hover{background:#303b50}main{margin-left:235px;padding:30px;max-width:1400px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:15px}.card,.panel{background:#192334;border:1px solid #35435a;border-radius:13px;padding:20px;margin-bottom:15px}.metric{font-size:30px;color:#f0c46e;font-weight:bold}input,select,textarea{background:#101825;border:1px solid #4d5a6c;border-radius:7px;color:white;padding:11px;width:100%;margin:7px 0 13px}button.primary{background:#edbe63;border:0;color:#151922;border-radius:8px;padding:12px 20px;font-weight:bold}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #38445a;padding:12px;text-align:left}.muted{color:#9faec1}.hidden{display:none}.notice{background:#322817;padding:12px;border-radius:8px;color:#f6d79b;margin:15px 0}label{display:block;margin-top:10px}#auth{max-width:540px;margin:8vh auto;padding:25px}.row{display:flex;gap:10px}.row>*{flex:1}@media(max-width:700px){aside{position:static;width:auto;min-height:0}nav{display:flex;overflow:auto}nav button{min-width:115px}main{margin:0;padding:15px}}.geo-brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.geo-waving-flag{display:inline-flex;width:43px;height:30px;perspective:160px;filter:drop-shadow(0 3px 4px #0008)}.geo-waving-flag svg{width:43px;height:29px;transform-origin:left center;animation:geoFlagWave 2.6s ease-in-out infinite;box-shadow:0 0 0 1px #ffffff55;border-radius:2px}@keyframes geoFlagWave{0%,100%{transform:rotateY(-14deg) skewY(-2deg) scaleX(.94)}25%{transform:rotateY(12deg) skewY(2deg)}50%{transform:rotateY(-18deg) skewY(-3deg) scaleX(.91)}75%{transform:rotateY(9deg) skewY(2deg)}}@media(prefers-reduced-motion:reduce){.geo-waving-flag svg{animation:none}}</style><body><div id="auth" class="panel"><h1>🛍 Market <span style="color:#edbe63">Geo</span></h1><p class="muted">Back Office · დემო ვერსია</p><div class="notice">Это локальная демонстрация. Не вводите настоящие паспортные данные. Для реальной регистрации потребуется защищённый сервер.</div><label>Название магазина<input id="shop" placeholder="Мой магазин"></label><label>Email<input id="email" type="email" placeholder="seller@example.ge"></label><label>Тип регистрации<select id="type"><option>Индивидуальный предприниматель</option><option>Компания</option></select></label><label>Идентификационный номер (тестовый)<input id="tax" placeholder="Тестовый номер"></label><button class="primary" id="enter">Открыть демоверсию</button></div><div id="app" class="hidden"><aside><h2 class="geo-brand">🛍 Market Geo <span class="geo-waving-flag" role="img" aria-label="Флаг Грузии"><svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="60" height="40" fill="#fff"/><path d="M0 16h60v8H0zM26 0h8v40h-8z" fill="#d82135"/><path d="M12 5h2v4h4v2h-4v4h-2v-4H8V9h4zm34 0h2v4h4v2h-4v4h-2v-4h-4V9h4zM12 25h2v4h4v2h-4v4h-2v-4H8v-2h4zm34 0h2v4h4v2h-4v4h-2v-4h-4v-2h4z" fill="#d82135"/></svg></span></h2><p class="muted" id="shopName"></p><nav id="nav"><button class="active" data-page="overview">📊 Главная</button><button data-page="products">📦 Товары</button><button data-page="warehouse">🏬 Склад</button><button data-page="orders">🛒 Заказы</button><button data-page="pos">💳 POS</button><button data-page="reviews">⭐ Отзывы</button><button data-page="settings">⚙ Настройки</button></nav><button id="logout">Выйти</button></aside><main><header style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h1 id="heading">Главная</h1><select id="lang" style="max-width:165px"><option value="ru">Русский</option><option value="ka">ქართული</option><option value="az">Azərbaycan</option></select></header><div class="notice">Демо: данные сохраняются только в этом браузере. Реальные заказы с сайта пока не подключены.</div><section id="content"></section></main></div><script>
const $=id=>document.getElementById(id), key='marketgeo_demo_v1';let state={shop:'',email:'',products:[],orders:[],reviews:[]},page='overview';try{const s=JSON.parse(localStorage.getItem(key));if(s&&typeof s==='object')state={...state,...s}}catch(e){}const save=()=>localStorage.setItem(key,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₾';const dict={ru:['Главная','Товары','Склад','Заказы','POS','Отзывы','Настройки'],ka:['მთავარი','პროდუქტები','საწყობი','შეკვეთები','POS','შეფასებები','პარამეტრები'],az:['Əsas','Məhsullar','Anbar','Sifarişlər','POS','Rəylər','Tənzimləmələr']};function render(){ $('auth').classList.toggle('hidden',!!state.shop);$('app').classList.toggle('hidden',!state.shop);if(!state.shop)return;$('shopName').textContent=state.shop;const ids=['overview','products','warehouse','orders','pos','reviews','settings'],idx=ids.indexOf(page),lang=$('lang').value;$('heading').textContent=dict[lang][idx];document.querySelectorAll('#nav button').forEach((b,i)=>{b.textContent=['📊 ','📦 ','🏬 ','🛒 ','💳 ','⭐ ','⚙ '][i]+dict[lang][i];b.classList.toggle('active',b.dataset.page===page)});let html='';if(page==='overview'){html=`<div class="cards"><div class="card"><div class="metric">${state.products.length}</div>Товаров</div><div class="card"><div class="metric">${state.products.reduce((a,p)=>a+Number(p.stock),0)}</div>На складе</div><div class="card"><div class="metric">${state.orders.length}</div>Заказов</div><div class="card"><div class="metric">${money(state.orders.reduce((a,o)=>a+o.total,0))}</div>Продажи (демо)</div></div><div class="panel"><h3>Добро пожаловать, ${esc(state.shop)}</h3><p>Добавьте товары и попробуйте оформить тестовую продажу через POS.</p></div>`}if(page==='products')html=`<div class="panel"><h3>Добавить товар</h3><form id="productForm"><label>Название<input name="name" required maxlength="120"></label><div class="row"><label>Цена ₾<input name="price" type="number" min="0" step="0.01" required></label><label>Количество<input name="stock" type="number" min="0" step="1" required></label></div><button class="primary">Добавить</button></form></div><div class="panel"><h3>Каталог</h3>${tableProducts()}</div>`;if(page==='warehouse')html=`<div class="panel"><h3>Остатки склада</h3>${tableProducts()}</div>`;if(page==='orders')html=`<div class="panel"><h3>Тестовые заказы</h3>${state.orders.length?'<table><tr><th>№</th><th>Дата</th><th>Товар</th><th>Сумма</th></tr>'+state.orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.date)}</td><td>${esc(o.name)}</td><td>${money(o.total)}</td></tr>`).join('')+'</table>':'Заказов пока нет'}</div>`;if(page==='pos')html=`<div class="panel"><h3>Новая тестовая продажа</h3><form id="posForm"><label>Товар<select name="id" required>${state.products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (остаток ${p.stock})</option>`).join('')}</select></label><label>Количество<input type="number" name="qty" value="1" min="1" required></label><button class="primary" ${state.products.some(p=>p.stock>0)?'':'disabled'}>Провести продажу</button></form></div>`;if(page==='reviews')html='<div class="panel"><h3>Отзывы покупателей</h3><p>Отзывы появятся после подключения магазина к общей базе данных.</p></div>';if(page==='settings')html=`<div class="panel"><h3>Профиль продавца</h3><p>Магазин: ${esc(state.shop)}</p><p>Email: ${esc(state.email)}</p><p class="muted">Проверка документов, подтверждение личности и права доступа требуют серверной части.</p><button id="export" class="primary">Скачать резервную копию демо-данных</button></div>`;$('content').innerHTML=html;const pf=$('productForm');if(pf)pf.onsubmit=e=>{e.preventDefault();let f=new FormData(pf);state.products.push({id:Date.now()+Math.floor(Math.random()*1000),name:String(f.get('name')).trim(),price:Number(f.get('price')),stock:Number(f.get('stock'))});save();render()};const pos=$('posForm');if(pos)pos.onsubmit=e=>{e.preventDefault();let f=new FormData(pos),p=state.products.find(x=>x.id===Number(f.get('id'))),q=Number(f.get('qty'));if(!p||!Number.isInteger(q)||q<1||q>p.stock)return alert('Недостаточно товара');p.stock-=q;state.orders.unshift({id:state.orders.length+1,date:new Date().toLocaleString(),name:p.name+' × '+q,total:p.price*q});save();render()};const exp=$('export');if(exp)exp.onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='market-geo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}function tableProducts(){return state.products.length?'<table><tr><th>Товар</th><th>Цена</th><th>Остаток</th><th></th></tr>'+state.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><button data-delete="${p.id}">Удалить</button></td></tr>`).join('')+'</table>':'Товары пока не добавлены'}$('enter').onclick=()=>{let shop=$('shop').value.trim(),email=$('email').value.trim();if(!shop||!$('email').checkValidity()||!email)return alert('Введите название магазина и корректный email');state.shop=shop;state.email=email;save();render()};$('logout').onclick=()=>{if(confirm('Закрыть демо-профиль? Локальные данные сохранятся.')){state.shop='';save();render()}};$('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};$('content').onclick=e=>{let b=e.target.closest('[data-delete]');if(b&&confirm('Удалить товар?')){state.products=state.products.filter(p=>p.id!==Number(b.dataset.delete));save();render()}};$('lang').onchange=render;render();
</script></body></html>
