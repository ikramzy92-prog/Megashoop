
<style>
  #mega-languages {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 9999;
    display: flex;
    gap: 6px;
    background: #172033;
    padding: 8px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0004;
  }
  #mega-languages button {
    padding: 9px 12px;
    border: 1px solid #52617b;
    border-radius: 8px;
    background: #263650;
    color: white;
    cursor: pointer;
    font-weight: bold;
  }
  #mega-languages button.active {
    background: #e4ad42;
    color: #172033;
  }
  header {
    padding-top: 65px !important;
  }
</style>

<div id="mega-languages">
  <button type="button" data-lang="ka">🇬🇪 KA</button>
  <button type="button" data-lang="ru">🇷🇺 RU</button>
  <button type="button" data-lang="az">🇦🇿 AZ</button>
</div>

<script>
(function () {
  const translations = {
    ru: {
      subtitle: "Электроинструменты, электроника и оборудование",
      catalog: "Каталог товаров",
      search: "Поиск товаров...",
      found: "Найдено товаров:",
      cart: "Корзина:",
      buy: "В корзину",
      stock: "В наличии:",
      remove: "Удалить",
      total: "Итого:",
      shortage: "Недостаточно товара на складе",
      rights: "Все права защищены."
    },
    ka: {
      subtitle: "ელექტროინსტრუმენტები, ელექტრონიკა და აღჭურვილობა",
      catalog: "პროდუქციის კატალოგი",
      search: "პროდუქციის ძებნა...",
      found: "ნაპოვნია პროდუქტი:",
      cart: "კალათა:",
      buy: "კალათაში დამატება",
      stock: "მარაგშია:",
      remove: "წაშლა",
      total: "სულ:",
      shortage: "მარაგში საკმარისი პროდუქტი არ არის",
      rights: "ყველა უფლება დაცულია."
    },
    az: {
      subtitle: "Elektrik alətləri, elektronika və avadanlıqlar",
      catalog: "Məhsul kataloqu",
      search: "Məhsul axtar...",
      found: "Tapılan məhsullar:",
      cart: "Səbət:",
      buy: "Səbətə əlavə et",
      stock: "Stokda:",
      remove: "Sil",
      total: "Cəmi:",
      shortage: "Anbarda kifayət qədər məhsul yoxdur",
      rights: "Bütün hüquqlar qorunur."
    }
  };

  const originals = [
    ["Электроинструменты, электроника и оборудование", "subtitle"],
    ["Каталог товаров", "catalog"],
    ["Найдено товаров:", "found"],
    ["Корзина:", "cart"],
    ["В корзину", "buy"],
    ["В наличии:", "stock"],
    ["Удалить", "remove"],
    ["Итого:", "total"],
    ["Все права защищены.", "rights"]
  ];

  let language = "ka";
  try {
    const saved = localStorage.getItem("mega-language");
    if (translations[saved]) language = saved;
  } catch (e) {}

  function translateText(value, dict) {
    let result = value;
    for (const [original, key] of originals) {
      const pattern = new RegExp(
        original.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"),
        "g"
      );
      result = result.replace(pattern, dict[key]);
      for (const lang of Object.keys(translations)) {
        result = result.replaceAll(
          translations[lang][key],
          dict[key]
        );
      }
    }
    return result;
  }

  function applyLanguage() {
    const dict = translations[language];
    document.documentElement.lang = language;

    document.querySelectorAll("#mega-languages button")
      .forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.lang === language
        );
      });

    const search = document.getElementById("search");
    if (search) search.placeholder = dict.search;

    const walker = document.createTreeWalker(
      document.body,
      NodeFilter.SHOW_TEXT
    );

    const nodes = [];
    while (walker.nextNode()) {
      const node = walker.currentNode;
      const parent = node.parentElement;
      if (!parent) continue;
      if (parent.closest("#mega-languages")) continue;
      if (["SCRIPT", "STYLE", "TEXTAREA"].includes(parent.tagName))
        continue;
      nodes.push(node);
    }

    for (const node of nodes) {
      const updated = translateText(node.nodeValue, dict);
      if (updated !== node.nodeValue) node.nodeValue = updated;
    }
  }

  document.querySelectorAll("#mega-languages button")
    .forEach(button => {
      button.addEventListener("click", () => {
        language = button.dataset.lang;
        try {
          localStorage.setItem("mega-language", language);
        } catch (e) {}
        applyLanguage();
      });
    });

  const observer = new MutationObserver(() => {
    observer.disconnect();
    applyLanguage();
    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  });

  applyLanguage();
  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();
</script>
