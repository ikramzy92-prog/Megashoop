
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Megashoop — интернет-магазин</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5fb;color:#17243d;font-family:Arial,sans-serif}
header{background:#1254d8;color:white;padding:24px 5%}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0}
nav{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:20px}
input{padding:13px;border:1px solid #ddd;border-radius:9px;font-size:16px;flex:1;min-width:180px}
button{background:#1254d8;color:white;border:0;padding:12px 16px;border-radius:9px;cursor:pointer}
button:disabled{background:#aab5c7;cursor:not-allowed}
.cart-button{background:white;color:#1254d8;font-weight:bold}
main{max-width:1200px;margin:auto;padding:25px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #0001;padding-bottom:16px}
.card img{width:100%;height:190px;object-fit:contain;background:#fff}
.info{padding:15px}
.info h3{margin:5px 0 12px;font-size:18px}
.price{font-size:23px;font-weight:bold;color:#1254d8}
.stock{font-size:13px;color:#687589}
.card button{width:100%;margin-top:12px}
#status{color:#64748b}
#cart{background:white;padding:20px;border-radius:14px;margin-top:25px}
.cart-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}
footer{text-align:center;padding:25px;color:#687589}
</style>
</head>
<body>
<header>
<h1>Megashoop</h1>
<p>Электроинструменты, электроника и оборудование</p>
<nav>
<input id="search" placeholder="Поиск товаров...">
<button class="cart-button" onclick="showCart()">Корзина 🛒 <span id="count">0</span></button>
</nav>
</header>

<main>
<h2>Каталог товаров</h2>
<p id="status">Загрузка товаров...</p>
<div id="products" class="grid"></div>

<section id="cart" hidden>
<h2>Ваша корзина</h2>
<div id="cartItems"></div>
<h3 id="total"></h3>
<p>Оформление заказов добавим на следующем этапе.</p>
</section>
</main>

<footer>© 2026 Megashoop. Все права защищены.</footer>

<script>
const SUPABASE_URL = "https://mrslybtwzfcovpsyuexf.supabase.co";

// ВСТАВЬ СЮДА СВОЙ ПУБЛИЧНЫЙ КЛЮЧ
const SUPABASE_KEY = " sb_publishable_AnpUjix60jDfpZDGlcO6vQ_XIyxcpDd";

let products = [];
let cart = [];

const money = n => Number(n).toLocaleString("ru-RU", {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
}) + " ₾";

async function loadProducts(){
  const status = document.getElementById("status");
  try{
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/" +
      encodeURIComponent("продукты") + "?select=*",
      {
        headers:{
          "apikey":SUPABASE_KEY
        }
      }
    );

    if(!response.ok) throw new Error(
      "Ошибка загрузки: " + response.status
    );

    products = await response.json();
    renderProducts(products);
    status.textContent = products.length
      ? "Найдено товаров: " + products.length
      : "Пока нет товаров";
  }catch(error){
    status.textContent = "Не удалось загрузить товары. Проверь подключение Supabase и права доступа.";
    console.error(error);
  }
}

function renderProducts(items){
  const container = document.getElementById("products");
  container.innerHTML = "";

  items.forEach(product=>{
    const card = document.createElement("article");
    card.className = "card";

    const img = document.createElement("img");
    img.alt = product["имя"] || "Товар";
    img.loading = "lazy";
    img.src = product.image_url ||
      "https://placehold.co/400x300?text=Megashoop";
    img.onerror = () => {
      img.onerror = null;
      img.src = "https://placehold.co/400x300?text=Megashoop";
    };

    const info = document.createElement("div");
    info.className = "info";

    const name = document.createElement("h3");
    name.textContent = product["имя"] || "Без названия";

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = money(product["цена"] || 0);

    const stock = document.createElement("p");
    stock.className = "stock";
    stock.textContent = "В наличии: " +
      (product["запас"] ?? 0) + " " +
      (product["единица"] || "шт");

    const button = document.createElement("button");
    button.textContent = "В корзину";
    button.disabled = Number(product["запас"] || 0) <= 0;
    button.onclick = () => addToCart(product);

    info.append(name,price,stock,button);
    card.append(img,info);
    container.append(card);
  });
}

function addToCart(product){
  const existing = cart.find(p=>p.id===product["идентифи"]);
  const quantity = existing ? existing.quantity : 0;

  if(quantity >= Number(product["запас"] || 0)){
    alert("Недостаточно товара на складе");
    return;
  }

  if(existing) existing.quantity++;
  else cart.push({
    id:product["идентифи"],
    name:product["имя"],
    price:Number(product["цена"] || 0),
    quantity:1
  });

  document.getElementById("count").textContent =
    cart.reduce((sum,p)=>sum+p.quantity,0);
  renderCart();
}

function showCart(){
  const element = document.getElementById("cart");
  element.hidden = !element.hidden;
  if(!element.hidden) element.scrollIntoView({behavior:"smooth"});
  renderCart();
}

function renderCart(){
  const container = document.getElementById("cartItems");
  container.innerHTML = "";

  cart.forEach(p=>{
    const row = document.createElement("div");
    row.className = "cart-row";
    const name = document.createElement("span");
    name.textContent = p.name + " × " + p.quantity;
    const price = document.createElement("strong");
    price.textContent = money(p.price*p.quantity);
    row.append(name,price);
    container.append(row);
  });

  document.getElementById("total").textContent =
    "Итого: " + money(
      cart.reduce((sum,p)=>sum+p.price*p.quantity,0)
    );
}

document.getElementById("search").addEventListener("input",e=>{
  const query = e.target.value.toLowerCase();
  renderProducts(products.filter(p=>
    String(p["имя"] || "").toLowerCase().includes(query)
  ));
});

loadProducts();
</script>
</body>
</html>
