
<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megashoop — Online Store</title>
<style>
:root {
  --bg:#090e17;
  --panel:#172233;
  --gold:#f2bb4b;
  --text:#f5f6fa;
  --muted:#a8b4c7;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:linear-gradient(135deg,#090e17,#152238);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}
header {
  background:linear-gradient(120deg,#101827,#263850);
  border-bottom:1px solid #38485d;
  padding:30px 5%;
}
.wrap { max-width:1150px;margin:auto; }
.top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}
.logo {
  font-size:38px;
  font-weight:900;
  letter-spacing:1px;
}
.logo span { color:var(--gold); }
.subtitle { color:#d2dbea; }
.languages {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
button {
  border:0;
  cursor:pointer;
  border-radius:10px;
  padding:13px 18px;
  font-weight:bold;
}
.languages button {
  background:#26364e;
  border:1px solid #53657c;
  color:white;
}
.languages button.active {
  background:var(--gold);
  color:#151c27;
}
.searchbar {
  display:flex;
  gap:12px;
  margin-top:28px;
}
input {
  flex:1;
  min-width:0;
  padding:16px;
  background:#101827;
  color:white;
  border:1px solid #42536b;
  border-radius:12px;
  font-size:16px;
}
input:focus {
  outline:2px solid var(--gold);
}
.gold {
  background:linear-gradient(135deg,#f8cc68,#e4a933);
  color:#111827;
}
.gold:hover { filter:brightness(1.1); }
main {
  max-width:1150px;
  margin:auto;
  padding:40px 20px 80px;
}
h2 { font-size:28px; }
#status { color:var(--muted); }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:24px;
  margin-top:28px;
}
.card {
  background:linear-gradient(155deg,#223149,#111b2b);
  border:1px solid #3b4b62;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 15px 35px #0005;
  transition:transform .2s;
}
.card:hover { transform:translateY(-5px); }
.photo {
  background:#243247;
  height:230px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.photo img {
  width:100%;
  height:100%;
  object-fit:contain;
}
.info { padding:20px; }
.info h3 {
  font-size:17px;
  min-height:48px;
  line-height:1.4;
}
.price {
  font-size:26px;
  color:var(--gold);
  font-weight:900;
  margin-top:15px;
}
.stock {
  color:var(--muted);
  font-size:14px;
}
.buy { width:100%;margin-top:12px; }
button:disabled {
  opacity:.45;
  cursor:not-allowed;
}
#cart {
  margin-top:35px;
  background:var(--panel);
  padding:25px;
  border:1px solid #40516a;
  border-radius:18px;
}
#cart[hidden] { display:none; }
.cart-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #40516a;
}
.cart-row button {
  background:#713039;
  color:white;
}
footer {
  background:#0a111d;
  color:var(--muted);
  padding:30px;
  text-align:center;
}
@media(max-width:600px) {
  .logo { font-size:30px; }
  .searchbar { flex-wrap:wrap; }
  .searchbar input { flex-basis:100%; }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr));gap:12px; }
  .photo { height:150px; }
  .info { padding:12px; }
  .info h3 { font-size:14px; }
  .price { font-size:21px; }
}
</style>
</head>
<body>

<header>
<div class="wrap">
  <div class="top">
    <div class="logo">Mega<span>shoop</span></div>
    <div class="languages">
      <button data-lang="ka">🇬🇪 ქართული</button>
      <button data-lang="ru">🇷🇺 Русский</button>
      <button data-lang="az">🇦🇿 Azərbaycan</button>
    </div>
  </div>
  <p id="subtitle" class="subtitle"></p>
  <div class="searchbar">
    <input id="search" type="search">
    <button id="cartToggle" class="gold"></button>
  </div>
</div>
</header>

<main>
  <h2 id="catalogTitle"></h2>
  <p id="status"></p>
  <div id="products" class="grid"></div>

  <section id="cart" hidden>
    <h2 id="cartTitle"></h2>
    <div id="cartItems"></div>
    <h3 id="total"></h3>
    <p id="checkoutNote"></p>
  </section>
</main>

<footer id="footer"></footer>

<script>
const SUPABASE_URL =
  "https://mrslybtwzfcovpsyuexf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_AnpUjix60jDfpZDGlcO6vQ_XIyxcpDd";

const $ = id => document.getElementById(id);

const words = {
  ka: {
    subtitle:"ელექტროინსტრუმენტები, ელექტრონიკა და აღჭურვილობა",
    catalog:"პროდუქციის კატალოგი",
    search:"პროდუქტის ძებნა...",
    cart:"კალათა",
    cartTitle:"თქვენი კალათა",
    found:"ნაპოვნია პროდუქტი:",
    loading:"პროდუქტები იტვირთება...",
    empty:"პროდუქტები არ არის",
    error:"პროდუქტების ჩატვირთვა ვერ მოხერხდა",
    stock:"მარაგშია:",
    buy:"კალათაში დამატება",
    sold:"არ არის მარაგში",
    total:"სულ:",
    remove:"წაშლა",
    shortage:"მარაგში საკმარისი რაოდენობა არ არის",
    note:"შეკვეთის გაფორმება მალე დაემატება.",
    footer:"ყველა უფლება დაცულია."
  },
  ru: {
    subtitle:"Электроинструменты, электроника и оборудование",
    catalog:"Каталог товаров",
    search:"Поиск товаров...",
    cart:"Корзина",
    cartTitle:"Ваша корзина",
    found:"Найдено товаров:",
    loading:"Загрузка товаров...",
    empty:"Товаров пока нет",
    error:"Не удалось загрузить товары",
    stock:"В наличии:",
    buy:"В корзину",
    sold:"Нет в наличии",
    total:"Итого:",
    remove:"Удалить",
    shortage:"Недостаточно товара на складе",
    note:"Оформление заказов добавим позже.",
    footer:"Все права защищены."
  },
  az: {
    subtitle:"Elektrik alətləri, elektronika və avadanlıqlar",
    catalog:"Məhsul kataloqu",
    search:"Məhsul axtar...",
    cart:"Səbət",
    cartTitle:"Sizin səbətiniz",
    found:"Tapılan məhsullar:",
    loading:"Məhsullar yüklənir...",
    empty:"Məhsul yoxdur",
    error:"Məhsulları yükləmək mümkün olmadı",
    stock:"Stokda:",
    buy:"Səbətə əlavə et",
    sold:"Stokda yoxdur",
    total:"Cəmi:",
    remove:"Sil",
    shortage:"Anbarda kifayət qədər məhsul yoxdur",
    note:"Sifariş sistemi tezliklə əlavə ediləcək.",
    footer:"Bütün hüquqlar qorunur."
  }
};

let language = "ka";
try {
  const saved = localStorage.getItem("megashoop-language");
  if (words[saved]) language = saved;
} catch(e) {}

let products = [];
let cart = [];
let loading = true;
let loadError = false;

function money(value) {
  return Number(value || 0).toLocaleString("en-US", {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  }) + " ₾";
}

function nameOf(p) {
  return p["имя"] || p.name || "Megashoop";
}
function priceOf(p) {
  return Number(p["цена"] ?? p.price ?? 0);
}
function stockOf(p) {
  return Number(p["запас"] ?? p.stock ?? 0);
}
function unitOf(p) {
  return p["единица"] || p.unit || "шт";
}
function idOf(p) {
  return p.id ?? p["идентифи"] ?? nameOf(p);
}

function translatePage() {
  const t = words[language];
  document.documentElement.lang = language;
  $("subtitle").textContent = t.subtitle;
  $("catalogTitle").textContent = t.catalog;
  $("search").placeholder = t.search;
  $("cartTitle").textContent = t.cartTitle;
  $("checkoutNote").textContent = t.note;
  $("footer").textContent =
    "© 2026 Megashoop. " + t.footer;

  document.querySelectorAll("[data-lang]").forEach(b => {
    b.classList.toggle("active",b.dataset.lang === language);
  });

  if (loading) $("status").textContent = t.loading;
  else if (loadError) $("status").textContent = t.error;
  else $("status").textContent =
    t.found + " " + products.length;

  updateCount();
  renderProducts();
  renderCart();
}

function updateCount() {
  const count = cart.reduce((s,p)=>s+p.quantity,0);
  $("cartToggle").textContent =
    "🛒 " + words[language].cart + " (" + count + ")";
}

function renderProducts() {
  const t = words[language];
  const container = $("products");
  container.replaceChildren();

  const query = $("search").value.toLowerCase().trim();
  const filtered = products.filter(p =>
    nameOf(p).toLowerCase().includes(query)
  );

  if (!loading && !loadError && !filtered.length) {
    const p = document.createElement("p");
    p.textContent = t.empty;
    container.append(p);
  }

  filtered.forEach(product => {
    const card = document.createElement("article");
    card.className = "card";

    const photo = document.createElement("div");
    photo.className = "photo";

    const img = document.createElement("img");
    img.alt = nameOf(product);
    img.loading = "lazy";
    img.src = product.image_url ||
      "https://placehold.co/400x300?text=Megashoop";
    img.onerror = () => {
      img.onerror = null;
      img.src = "https://placehold.co/400x300?text=Megashoop";
    };
    photo.append(img);

    const info = document.createElement("div");
    info.className = "info";

    const name = document.createElement("h3");
    name.textContent = nameOf(product);

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = money(priceOf(product));

    const stock = document.createElement("p");
    stock.className = "stock";
    stock.textContent =
      t.stock + " " + stockOf(product) + " " + unitOf(product);

    const button = document.createElement("button");
    button.className = "gold buy";
    button.textContent = stockOf(product) > 0 ? t.buy : t.sold;
    button.disabled = stockOf(product) <= 0;
    button.onclick = () => addToCart(product);

    info.append(name,price,stock,button);
    card.append(photo,info);
    container.append(card);
  });
}

function addToCart(product) {
  const id = idOf(product);
  const existing = cart.find(p=>p.id === id);
  const quantity = existing ? existing.quantity : 0;

  if (quantity >= stockOf(product)) {
    alert(words[language].shortage);
    return;
  }

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({
      id:id,
      name:nameOf(product),
      price:priceOf(product),
      quantity:1
    });
  }
  updateCount();
  renderCart();
}

function renderCart() {
  const container = $("cartItems");
  container.replaceChildren();

  cart.forEach(item => {
    const row = document.createElement("div");
    row.className = "cart-row";

    const label = document.createElement("span");
    label.textContent =
      item.name + " × " + item.quantity;

    const price = document.createElement("strong");
    price.textContent = money(item.price * item.quantity);

    const remove = document.createElement("button");
    remove.textContent = words[language].remove;
    remove.onclick = () => {
      cart = cart.filter(p=>p.id !== item.id);
      updateCount();
      renderCart();
    };

    row.append(label,price,remove);
    container.append(row);
  });

  const sum = cart.reduce(
    (s,p)=>s+p.price*p.quantity,0
  );
  $("total").textContent =
    words[language].total + " " + money(sum);
}

async function loadProducts() {
  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/products?select=*",
      { headers:{apikey:SUPABASE_KEY} }
    );
    if (!response.ok) {
      throw new Error("Supabase HTTP " + response.status);
    }
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("Invalid data");
    products = data;
    loadError = false;
  } catch(error) {
    console.error(error);
    loadError = true;
  } finally {
    loading = false;
    translatePage();
  }
}

document.querySelectorAll("[data-lang]").forEach(b => {
  b.addEventListener("click", () => {
    language = b.dataset.lang;
    try {
      localStorage.setItem("megashoop-language",language);
    } catch(e) {}
    translatePage();
  });
});

$("search").addEventListener("input",renderProducts);

$("cartToggle").addEventListener("click", () => {
  $("cart").hidden = !$("cart").hidden;
  if (!$("cart").hidden) {
    $("cart").scrollIntoView({behavior:"smooth"});
  }
});

translatePage();
loadProducts();
</script>
</body>
</html>
