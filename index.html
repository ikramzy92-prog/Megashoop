
<style>
  body {
    background: #f5f2eb !important;
    color: #202734 !important;
  }
  header {
    background: linear-gradient(120deg,#151d2e,#293b50) !important;
  }
  .card, .карта {
    border-radius: 18px !important;
    box-shadow: 0 8px 24px #15203318 !important;
  }
  button {
    border-radius: 10px !important;
  }
  #language-switcher {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
  }
  #language-switcher button {
    background: #ffffff;
    color: #182334;
    border: 1px solid #d6d9e0;
    padding: 10px 14px;
    cursor: pointer;
  }
  #language-switcher button.active {
    background: #d9ad62;
    color: #171717;
    border-color: #d9ad62;
  }
</style>

<script>
(function () {
  const dictionary = {
    ru: {
      "Каталог товаров": "Каталог товаров",
      "Найдено товаров:": "Найдено товаров:",
      "В корзину": "В корзину",
      "В наличии:": "В наличии:",
      "Корзина:": "Корзина:",
      "Поиск товаров...": "Поиск товаров...",
      "Электроинструменты, электроника и оборудование":
        "Электроинструменты, электроника и оборудование",
      "Удалить": "Удалить",
      "Недостаточно товара на складе":
        "Недостаточно товара на складе"
    },
    ka: {
      "Каталог товаров": "პროდუქციის კატალოგი",
      "Найдено товаров:": "ნაპოვნია პროდუქტები:",
      "В корзину": "კალათაში დამატება",
      "В наличии:": "მარაგშია:",
      "Корзина:": "კალათა:",
      "Поиск товаров...": "პროდუქტის ძებნა...",
      "Электроинструменты, электроника и оборудование":
        "ელექტროინსტრუმენტები, ელექტრონიკა და აღჭურვილობა",
      "Удалить": "წაშლა",
      "Недостаточно товара на складе":
        "მარაგში საკმარისი პროდუქტი არ არის"
    },
    az: {
      "Каталог товаров": "Məhsul kataloqu",
      "Найдено товаров:": "Tapılan məhsullar:",
      "В корзину": "Səbətə əlavə et",
      "В наличии:": "Stokda:",
      "Корзина:": "Səbət:",
      "Поиск товаров...": "Məhsul axtarışı...",
      "Электроинструменты, электроника и оборудование":
        "Elektrik alətləri, elektronika və avadanlıqlar",
      "Удалить": "Sil",
      "Недостаточно товара на складе":
        "Anbarda kifayət qədər məhsul yoxdur"
    }
  };

  let language = localStorage.getItem("megashoop-language") || "ka";
  if (!dictionary[language]) language = "ka";

  const original = dictionary.ru;
  const keys = Object.keys(original);
  const phrases = [...new Set(
    Object.values(dictionary).flatMap(Object.keys)
      .concat(Object.values(dictionary).flatMap(Object.values))
  )].sort((a,b) => b.length-a.length);

  function translateString(value) {
    if (!value || !value.trim()) return value;
    let result = value;
    for (const phrase of phrases) {
      const key = keys.find(k =>
        Object.values(dictionary).some(d => d[k] === phrase)
      );
      if (key && dictionary[language][key]) {
        result = result.split(phrase).join(dictionary[language][key]);
      }
    }
    return result;
  }

  const sourceText = new WeakMap();
  const sourcePlaceholders = new WeakMap();
  let applying = false;

  function translatePage() {
    if (applying) return;
    applying = true;
    const walker = document.createTreeWalker(
      document.body, NodeFilter.SHOW_TEXT
    );
    let node;
    while ((node = walker.nextNode())) {
      if (node.parentElement?.closest(
        "script,style,#language-switcher"
      )) continue;
      let base = sourceText.get(node);
      if (base === undefined) {
        base = node.nodeValue;
        sourceText.set(node, base);
      } else if (node.nodeValue !== translateString(base)) {
        base = node.nodeValue;
        sourceText.set(node, base);
      }
      const translated = translateString(base);
      if (node.nodeValue !== translated) node.nodeValue = translated;
    }

    document.querySelectorAll("input[placeholder]").forEach(input => {
      let base = sourcePlaceholders.get(input);
      if (base === undefined) {
        base = input.placeholder;
        sourcePlaceholders.set(input, base);
      }
      input.placeholder = translateString(base);
    });

    document.documentElement.lang = language;
    document.querySelectorAll("#language-switcher button")
      .forEach(btn => btn.classList.toggle(
        "active", btn.dataset.lang === language
      ));
    applying = false;
  }

  const switcher = document.createElement("div");
  switcher.id = "language-switcher";
  switcher.innerHTML = `
    <button data-lang="ka">🇬🇪 ქართული</button>
    <button data-lang="ru">🇷🇺 Русский</button>
    <button data-lang="az">🇦🇿 Azərbaycan</button>
  `;

  const location = document.querySelector("header") || document.body;
  location.appendChild(switcher);

  switcher.addEventListener("click", event => {
    const btn = event.target.closest("button[data-lang]");
    if (!btn) return;
    language = btn.dataset.lang;
    localStorage.setItem("megashoop-language", language);
    translatePage();
  });

  const observer = new MutationObserver(() => translatePage());
  observer.observe(document.body, {
    childList: true,
    subtree: true,
    characterData: true
  });

  translatePage();
})();
</script>
