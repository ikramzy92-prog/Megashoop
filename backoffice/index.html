<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Geo — Back Office</title><style>
:root{font-family:Arial,sans-serif;color-scheme:dark;--bg:#0c1017;--panel:#171e29;--line:#303c4d;--gold:#edbc60}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef1f5}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}aside{width:250px;flex-shrink:0;background:#111824;border-right:1px solid var(--line);padding:24px 14px}.brand{font-size:24px;font-weight:900;color:var(--gold);padding:5px 12px 25px}.brand small{display:block;color:#b9c3d1;font-size:12px;margin-top:5px}nav button{display:block;width:100%;border:0;border-radius:9px;background:transparent;color:#cbd5e1;text-align:left;padding:14px;margin:3px 0}nav button.active,nav button:hover{background:#2a3545;color:#ffdc98}main{flex:1;min-width:0;padding:30px;max-width:1500px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:25px}.top h1{margin:0;font-size:28px}.top select,.field{background:#111824;border:1px solid #47566b;border-radius:8px;color:white;padding:11px}.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:16px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:21px}.card small{color:#a9b6c7}.card strong{display:block;font-size:28px;margin-top:12px;color:var(--gold)}.panel{margin-top:22px;overflow:auto}.panel h2{margin-top:0}.form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.field{min-width:120px;flex:1}.primary{background:var(--gold);color:#1c1c1c;border:0;border-radius:8px;padding:12px 17px;font-weight:800}.secondary{background:#2b394b;color:white;border:1px solid #4a5b70;border-radius:8px;padding:8px 12px}.danger{background:#4d2730;color:#ffe2e2;border:1px solid #834452;border-radius:8px;padding:8px 12px}table{border-collapse:collapse;width:100%;min-width:580px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{color:#b3c0cf;font-size:13px}section[hidden]{display:none}.muted{color:#a7b2c1}.notice{padding:12px;background:#29251b;border:1px solid #6c532c;border-radius:9px;color:#f5d69a;margin-bottom:22px}#toast{min-height:24px;color:#f3c66c;margin-top:10px}.flag{font-size:25px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.app{display:block}aside{width:auto;padding:12px}.brand{padding:8px}nav{display:flex;overflow-x:auto;gap:5px}nav button{white-space:nowrap;width:auto;padding:10px}main{padding:17px}.cards{grid-template-columns:1fr 1fr}.card{padding:13px}.card strong{font-size:22px}}
</style></head><body><div class="app"><aside><div class="brand"><span class="flag">🇬🇪</span> Market Geo<small>BACK OFFICE · DEMO</small></div><nav id="nav"></nav></aside><main><div class="top"><h1 id="heading"></h1><select id="lang" aria-label="Language"><option value="ka">🇬🇪 ქართული</option><option value="ru">🇷🇺 Русский</option><option value="az">🇦🇿 Azərbaycan</option></select></div><div class="notice" id="notice"></div><section id="dashboard"><div class="cards"><div class="card"><small data-t="products"></small><strong id="statProducts">0</strong></div><div class="card"><small data-t="orders"></small><strong id="statOrders">0</strong></div><div class="card"><small data-t="revenue"></small><strong id="statRevenue">0 ₾</strong></div><div class="card"><small data-t="lowStock"></small><strong id="statLow">0</strong></div></div><div class="panel"><h2 data-t="recent"></h2><div id="recentOrders"></div></div></section><section id="products" hidden><div class="panel"><h2 data-t="addProduct"></h2><form id="productForm" class="form"><input id="pname" class="field" required maxlength="120" placeholder="Name"><input id="pprice" class="field" required type="number" min="0.01" step="0.01" placeholder="₾"><input id="pqty" class="field" required type="number" min="0" step="1" placeholder="Qty"><button class="primary" data-t="save"></button></form><div id="toast" role="status"></div></div><div class="panel"><h2 data-t="products"></h2><div id="productsTable"></div></div></section><section id="warehouse" hidden><div class="panel"><h2 data-t="warehouse"></h2><p class="muted" data-t="warehouseHelp"></p><div id="warehouseTable"></div></div></section><section id="pos" hidden><div class="panel"><h2 data-t="pos"></h2><form id="posForm" class="form"><select id="posProduct" class="field" required></select><input id="posQty" class="field" type="number" min="1" step="1" value="1" required><button class="primary" data-t="sell"></button></form><p class="muted" data-t="posHelp"></p></div></section><section id="orders" hidden><div class="panel"><h2 data-t="orders"></h2><div id="ordersTable"></div></div></section><section id="analytics" hidden><div class="panel"><h2 data-t="analytics"></h2><div id="analyticsContent"></div></div></section><section id="settings" hidden><div class="panel"><h2 data-t="settings"></h2><form id="settingsForm" class="form"><input class="field" id="shopName" maxlength="100" required><button class="primary" data-t="save"></button></form><p class="muted" data-t="settingsHelp"></p></div></section></main></div><script>
'use strict';const dict={ru:{dashboard:'Обзор',products:'Товары',warehouse:'Склад',pos:'POS-касса',orders:'Заказы',analytics:'Статистика',settings:'Настройки',revenue:'Выручка',lowStock:'Мало на складе',recent:'Последние продажи',addProduct:'Добавить товар',save:'Сохранить',sell:'Продать',warehouseHelp:'Остатки товаров. Изменить количество можно в разделе «Товары».',posHelp:'Продажа уменьшает остаток и создаёт заказ в этом браузере.',settingsHelp:'Название магазина сохраняется только в этом браузере.',notice:'Демонстрация: данные сохраняются только в этом браузере. Нет настоящего входа, синхронизации с магазином и онлайн-платежей.',name:'Название',price:'Цена',qty:'Количество',action:'Действие',delete:'Удалить',date:'Дата',total:'Сумма',empty:'Пока нет данных',saved:'Сохранено',insufficient:'Недостаточно товара',confirmDelete:'Удалить товар?',sold:'Продажа проведена',salesCount:'Количество продаж'},ka:{dashboard:'მიმოხილვა',products:'პროდუქტები',warehouse:'საწყობი',pos:'POS სალარო',orders:'შეკვეთები',analytics:'სტატისტიკა',settings:'პარამეტრები',revenue:'შემოსავალი',lowStock:'დაბალი მარაგი',recent:'ბოლო გაყიდვები',addProduct:'პროდუქტის დამატება',save:'შენახვა',sell:'გაყიდვა',warehouseHelp:'პროდუქტების ნაშთები. რაოდენობა შეცვალეთ პროდუქტების განყოფილებაში.',posHelp:'გაყიდვა ამცირებს მარაგს და ქმნის შეკვეთას ამ ბრაუზერში.',settingsHelp:'მაღაზიის სახელი ინახება მხოლოდ ამ ბრაუზერში.',notice:'დემო ვერსია: მონაცემები ინახება მხოლოდ ამ ბრაუზერში. რეალური ავტორიზაცია, მაღაზიასთან სინქრონიზაცია და ონლაინ გადახდები არ არის ჩართული.',name:'დასახელება',price:'ფასი',qty:'რაოდენობა',action:'მოქმედება',delete:'წაშლა',date:'თარიღი',total:'ჯამი',empty:'მონაცემები ჯერ არ არის',saved:'შენახულია',insufficient:'არასაკმარისი მარაგი',confirmDelete:'წავშალოთ პროდუქტი?',sold:'გაყიდვა შესრულდა',salesCount:'გაყიდვების რაოდენობა'},az:{dashboard:'İcmal',products:'Məhsullar',warehouse:'Anbar',pos:'POS kassa',orders:'Sifarişlər',analytics:'Statistika',settings:'Tənzimləmələr',revenue:'Gəlir',lowStock:'Az qalıq',recent:'Son satışlar',addProduct:'Məhsul əlavə et',save:'Yadda saxla',sell:'Sat',warehouseHelp:'Məhsul qalıqları. Miqdarı Məhsullar bölməsində dəyişin.',posHelp:'Satış qalığı azaldır və bu brauzerdə sifariş yaradır.',settingsHelp:'Mağaza adı yalnız bu brauzerdə saxlanılır.',notice:'Demo: məlumatlar yalnız bu brauzerdə saxlanılır. Real giriş, mağaza ilə sinxronizasiya və onlayn ödəniş yoxdur.',name:'Ad',price:'Qiymət',qty:'Miqdar',action:'Əməliyyat',delete:'Sil',date:'Tarix',total:'Cəm',empty:'Hələ məlumat yoxdur',saved:'Yadda saxlanıldı',insufficient:'Kifayət qədər məhsul yoxdur',confirmDelete:'Məhsul silinsin?',sold:'Satış tamamlandı',salesCount:'Satış sayı'}};
const keys=['dashboard','products','warehouse','pos','orders','analytics','settings'];const $=id=>document.getElementById(id);const load=(k,fallback)=>{try{const v=JSON.parse(localStorage.getItem('marketgeo_demo_'+k));return Array.isArray(v)?v:fallback}catch{return fallback}};let products=load('products',[]),orders=load('orders',[]),lang=localStorage.getItem('marketgeo_demo_lang')||'ka',page='dashboard';if(!dict[lang])lang='ka';const tr=k=>dict[lang][k]||k;const persist=()=>{localStorage.setItem('marketgeo_demo_products',JSON.stringify(products));localStorage.setItem('marketgeo_demo_orders',JSON.stringify(orders))};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toFixed(2)+' ₾';const table=(headers,rows)=>rows.length?'<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>':'<p class="muted">'+esc(tr('empty'))+'</p>';function render(){document.documentElement.lang=lang;$('lang').value=lang;$('nav').innerHTML=keys.map(k=>'<button type="button" data-page="'+k+'" class="'+(page===k?'active':'')+'">'+esc(tr(k))+'</button>').join('');$('heading').textContent=tr(page);document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tr(el.dataset.t));$('notice').textContent=tr('notice');keys.forEach(k=>$(k).hidden=k!==page);$('pname').placeholder=tr('name');$('pprice').placeholder=tr('price')+' ₾';$('pqty').placeholder=tr('qty');$('shopName').value=localStorage.getItem('marketgeo_demo_shop')||'Market Geo';$('statProducts').textContent=products.length;$('statOrders').textContent=orders.length;$('statRevenue').textContent=money(orders.reduce((s,o)=>s+o.total,0));$('statLow').textContent=products.filter(p=>p.qty<5).length;const orderRows=orders.slice().reverse().map(o=>'<tr><td>'+esc(o.date)+'</td><td>'+esc(o.name)+'</td><td>'+o.qty+'</td><td>'+money(o.total)+'</td></tr>');$('ordersTable').innerHTML=table([tr('date'),tr('name'),tr('qty'),tr('total')],orderRows);$('recentOrders').innerHTML=table([tr('date'),tr('name'),tr('qty'),tr('total')],orderRows.slice(0,5));$('productsTable').innerHTML=table([tr('name'),tr('price'),tr('qty'),tr('action')],products.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+money(p.price)+'</td><td><input class="field" aria-label="'+esc(tr('qty'))+'" style="width:95px" type="number" min="0" step="1" value="'+p.qty+'" data-qty="'+p.id+'"></td><td><button class="danger" data-delete="'+p.id+'">'+esc(tr('delete'))+'</button></td></tr>'));$('warehouseTable').innerHTML=table([tr('name'),tr('qty')],products.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.qty+'</td></tr>'));$('posProduct').innerHTML=products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — '+money(p.price)+' ('+p.qty+')</option>').join('');$('analyticsContent').innerHTML='<div class="cards"><div class="card"><small>'+esc(tr('salesCount'))+'</small><strong>'+orders.length+'</strong></div><div class="card"><small>'+esc(tr('revenue'))+'</small><strong>'+money(orders.reduce((s,o)=>s+o.total,0))+'</strong></div></div>'} $('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});$('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('marketgeo_demo_lang',lang);render()});$('productForm').addEventListener('submit',e=>{e.preventDefault();const name=$('pname').value.trim(),price=Number($('pprice').value),qty=Number($('pqty').value);if(!name||!Number.isFinite(price)||price<=0||!Number.isSafeInteger(qty)||qty<0)return;products.push({id:Date.now()+'_'+Math.random().toString(36).slice(2),name,price,qty});persist();e.target.reset();render();$('toast').textContent=tr('saved')});$('productsTable').addEventListener('change',e=>{if(!e.target.matches('[data-qty]'))return;const p=products.find(x=>x.id===e.target.dataset.qty),v=Number(e.target.value);if(p&&Number.isSafeInteger(v)&&v>=0){p.qty=v;persist()}render()});$('productsTable').addEventListener('click',e=>{const b=e.target.closest('[data-delete]');if(!b||!confirm(tr('confirmDelete')))return;products=products.filter(p=>p.id!==b.dataset.delete);persist();render()});$('posForm').addEventListener('submit',e=>{e.preventDefault();const p=products.find(x=>x.id===$('posProduct').value),qty=Number($('posQty').value);if(!p||!Number.isSafeInteger(qty)||qty<1)return;if(qty>p.qty){alert(tr('insufficient'));return}p.qty-=qty;orders.push({id:Date.now(),date:new Date().toLocaleString(),name:p.name,qty,total:Math.round(p.price*qty*100)/100});persist();render();alert(tr('sold'))});$('settingsForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('marketgeo_demo_shop',$('shopName').value.trim());alert(tr('saved'))});render();
</script></body></html>
