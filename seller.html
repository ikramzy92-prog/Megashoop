<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ModernMarket — გამყიდველის კაბინეტი</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101014;color:#f7f3e9;font:16px system-ui,Arial}header{padding:20px;background:#1d1b1b;border-bottom:1px solid #9c7a33}main{max-width:850px;margin:auto;padding:20px}.card{background:#1b1b20;border:1px solid #50442d;border-radius:14px;padding:20px;margin:16px 0}h1,h2{color:#e8bd64}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;background:#2b2b31;border:1px solid #777;color:white;border-radius:8px}button{background:#d6aa51;color:#191919;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;margin:4px}button.secondary{background:#444;color:#fff}.muted{color:#bcbcbc}.hidden{display:none}.product{padding:12px;border-bottom:1px solid #444}#message{white-space:pre-wrap;color:#eacb88}label{display:block}</style></head><body><header><strong>MODERN<span style="color:#e8bd64">MARKET</span></strong> — გამყიდველის კაბინეტი</header><main>
<h1>გამყიდველის კაბინეტი</h1><p class="muted">რეგისტრაცია • საკუთარი მაღაზია • პროდუქტები</p><div id="message" role="status"></div>
<section id="auth" class="card"><h2>შესვლა / რეგისტრაცია</h2><label>Email<input id="email" type="email" autocomplete="email"></label><label>პაროლი (მინ. 6 სიმბოლო)<input id="password" type="password" minlength="6" autocomplete="new-password"></label><button id="signup">რეგისტრაცია</button><button id="signin" class="secondary">შესვლა</button></section>
<section id="panel" class="hidden"><button id="signout" class="secondary">გასვლა</button><div id="shopCreate" class="card"><h2>შექმენი შენი მაღაზია</h2><label>მაღაზიის სახელი<input id="shopName" maxlength="100"></label><label>აღწერა<textarea id="shopDesc" maxlength="2000"></textarea></label><button id="createShop">მაღაზიის შექმნა</button></div>
<div id="shopPanel" class="hidden"><div class="card"><h2 id="shopTitle"></h2><p id="shopStatus"></p></div><div class="card"><h2>პროდუქტის დამატება</h2><label>პროდუქტის სახელი<input id="productName" maxlength="150"></label><label>აღწერა<textarea id="productDesc"></textarea></label><label>კატეგორია<select id="category"><option value="tools">ელექტრო ხელსაწყოები</option><option value="fashion">ტანსაცმელი</option><option value="electronics">ელექტრონიკა</option><option value="toys">სათამაშოები</option><option value="other">სხვა</option></select></label><label>ფასი (₾)<input id="price" type="number" min="0" step="0.01"></label><label>რაოდენობა<input id="stock" type="number" min="0" step="1" value="1"></label><label>სურათის HTTPS ბმული<input id="imageUrl" type="url" placeholder="https://..."></label><button id="addProduct">პროდუქტის დამატება</button><p class="muted">ახალი პროდუქტები გამოქვეყნებამდე გადის შემოწმებას.</p></div><div class="card"><h2>ჩემი პროდუქტები</h2><div id="products"></div></div></div></section>
</main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// REPLACE BOTH VALUES. Use the PUBLIC anon/publishable key, NEVER service_role or secret key.
const SUPABASE_URL='PASTE_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY='PASTE_SUPABASE_PUBLISHABLE_KEY';
const $=id=>document.getElementById(id);const msg=t=>$('message').textContent=t;
const ready=SUPABASE_URL.startsWith('https://') && !SUPABASE_ANON_KEY.startsWith('PASTE_');
if(!ready)msg('Setup required: add Supabase URL and publishable/anon key in seller.html');
const db=ready?createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let shop=null;
function report(e){msg(e?.message||String(e))}
async function refresh(){if(!db)return;const {data:{user},error}=await db.auth.getUser();if(error)report(error);$('auth').classList.toggle('hidden',!!user);$('panel').classList.toggle('hidden',!user);if(!user)return;
const r=await db.from('mm_shops').select('*').eq('owner_id',user.id).maybeSingle();if(r.error)return report(r.error);shop=r.data;
$('shopCreate').classList.toggle('hidden',!!shop);$('shopPanel').classList.toggle('hidden',!shop);
if(!shop)return;$('shopTitle').textContent=shop.name;$('shopStatus').textContent='სტატუსი: '+shop.status;
const p=await db.from('mm_products').select('id,name,price_gel,stock,status').eq('shop_id',shop.id).order('created_at',{ascending:false});if(p.error)return report(p.error);
const list=$('products');list.replaceChildren();if(!p.data.length){list.textContent='პროდუქტები ჯერ არ არის';return}for(const item of p.data){const div=document.createElement('div');div.className='product';div.textContent=`${item.name} — ${item.price_gel} ₾ — ${item.stock} ც. — ${item.status}`;list.append(div)} }
$('signup').onclick=async()=>{if(!db)return;const {error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});if(error)return report(error);msg('შეამოწმეთ ელფოსტა დასადასტურებლად (თუ ჩართულია).');await refresh()};
$('signin').onclick=async()=>{if(!db)return;const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return report(error);msg('წარმატებით შეხვედით');await refresh()};
$('signout').onclick=async()=>{if(!db)return;await db.auth.signOut();shop=null;msg('');await refresh()};
$('createShop').onclick=async()=>{if(!db)return;const {data:{user}}=await db.auth.getUser();if(!user)return msg('ჯერ გაიარეთ ავტორიზაცია');const {error}=await db.from('mm_shops').insert({owner_id:user.id,name:$('shopName').value.trim(),description:$('shopDesc').value.trim()});if(error)return report(error);msg('მაღაზია შეიქმნა. დაელოდეთ დადასტურებას.');await refresh()};
$('addProduct').onclick=async()=>{if(!db||!shop)return;const name=$('productName').value.trim(),price=Number($('price').value),stock=Number($('stock').value),url=$('imageUrl').value.trim();if(name.length<2||!$('price').value||price<0||!Number.isInteger(stock)||stock<0)return msg('შეავსეთ სახელი, ფასი და რაოდენობა სწორად');if(url&&!/^https:\/\//i.test(url))return msg('სურათის ბმული უნდა იწყებოდეს https://');const {error}=await db.from('mm_products').insert({shop_id:shop.id,name,description:$('productDesc').value.trim(),category:$('category').value,price_gel:price,stock,image_url:url||null});if(error)return report(error);msg('პროდუქტი დაემატა და ელოდება დადასტურებას');$('productName').value='';await refresh()};
if(db){db.auth.onAuthStateChange(()=>{setTimeout(refresh,0)});refresh()}
</script></body></html>
